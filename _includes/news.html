          
<div class="news">
  <div class="news-heading">
    <h2>{% if page.language == 'zh' %}最新动态{% else %}news{% endif %}</h2>
    <a href="{% if page.language == 'zh' %}{{ '/zh/news/' | relative_url }}{% else %}{{ '/news/' | relative_url }}{% endif %}">{% if page.language == 'zh' %}全部动态{% else %}More news{% endif %} <span aria-hidden="true">→</span></a>
  </div>
  {% if site.news != blank %}
    {% include news_list.html limit=site.news_limit compact=true %}
  {% else %}
    <p>No news so far...</p>
  {% endif %}
</div>
